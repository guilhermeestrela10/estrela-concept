name: Backup criptografado do Supabase

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read

concurrency:
  group: supabase-database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar Supabase CLI
        run: npm install --global supabase@3.0.0

      - name: Exportar banco e criptografar
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SUPABASE_DB_URL" || -z "$BACKUP_ENCRYPTION_PASSPHRASE" ]]; then
            echo "::error::Configure SUPABASE_DB_URL e BACKUP_ENCRYPTION_PASSPHRASE nos Actions secrets."
            exit 1
          fi
          if [[ ${#BACKUP_ENCRYPTION_PASSPHRASE} -lt 24 ]]; then
            echo "::error::BACKUP_ENCRYPTION_PASSPHRASE precisa ter pelo menos 24 caracteres."
            exit 1
          fi
          work="$(mktemp -d)"
          archive="$RUNNER_TEMP/estrela-supabase-backup.tar.gz"
          trap 'rm -rf "$work" "$archive"' EXIT
          supabase db dump --db-url "$SUPABASE_DB_URL" --role-only -f "$work/roles.sql"
          supabase db dump --db-url "$SUPABASE_DB_URL" -f "$work/schema.sql"
          supabase db dump --db-url "$SUPABASE_DB_URL" --data-only --use-copy -f "$work/data.sql"
          tar -czf "$archive" -C "$work" roles.sql schema.sql data.sql
          printf '%s' "$BACKUP_ENCRYPTION_PASSPHRASE" > "$work/passphrase"
          chmod 600 "$work/passphrase"
          gpg --batch --yes --pinentry-mode loopback --passphrase-file "$work/passphrase" \
            --symmetric --cipher-algo AES256 --s2k-mode 3 --s2k-digest-algo SHA512 \
            --s2k-count 65011712 --output "$RUNNER_TEMP/estrela-supabase-backup.tar.gz.gpg" \
            "$archive"
          rm -f "$archive"
          rm "$work/passphrase"
          test -s "$RUNNER_TEMP/estrela-supabase-backup.tar.gz.gpg"

      - name: Guardar cópia criptografada por 30 dias
        uses: actions/upload-artifact@v4
        with:
          name: estrela-supabase-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/estrela-supabase-backup.tar.gz.gpg
          if-no-files-found: error
          retention-days: 30
